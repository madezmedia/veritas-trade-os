# SECRETS TEMPLATE
# Copy this to secrets.toml and fill in your actual values
# NEVER commit secrets.toml to git

[kraken]
api_key = "YOUR_KRAKEN_API_KEY"
api_secret = "YOUR_KRAKEN_API_SECRET"
# For withdrawals (NEVER enable for trading bots)
# withdrawal_key = "YOUR_WITHDRAWAL_KEY"

[base]
rpc_url = "https://sepolia.base.org"
# For testnet, use a faucet:
# https://docs.base.org/base-chain/network-information/network-faucets
private_key = "YOUR_BASE_PRIVATE_KEY"
wallet_address = "YOUR_BASE_WALLET_ADDRESS"

[auditor]
# Private key for signing EIP-712 attestations
# Can be the same as base.private_key or separate
signing_key = "YOUR_SIGNING_PRIVATE_KEY"
identity_address = "YOUR_AGENT_IDENTITY_ADDRESS"

[erc8004]
# ERC-8004 Registry contract address on Base Sepolia
# TODO: Deploy our own or use existing
registry_address = "0x0000000000000000000000000000000000000000"

[security]
# Encryption password for local state files (optional)
state_encryption_key = "YOUR_ENCRYPTION_PASSWORD"
